services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    env_file:
      - .env
    environment:
      WP_CLI_ALLOW_ROOT: '1'
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/zz-app.ini:ro
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '9000']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - portfolio

  web:
    image: nginx:alpine
    ports:
      - '8754:80'
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1/healthz.txt']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - portfolio

  database:
    image: mariadb:12
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - '3309:3306'
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - portfolio

  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile
    working_dir: /app
    environment:
      VITE_DOCKER: 'true'
      VITE_ORIGIN: http://localhost:5173
      VITE_HMR_HOST: localhost
      APP_URL: http://localhost:8754
    volumes:
      - ./web/app/themes/sage:/app
      - sage_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    networks:
      - portfolio

networks:
  portfolio:
    driver: bridge

volumes:
  db_data:
  sage_node_modules:
